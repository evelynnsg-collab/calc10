<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senai Suzano007</title>
    <style>
        /* CSS Básico */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2f4f4f 0%, #0f2a4a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #f7f7f2;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 350px;
            text-align: center;
            border: 2px solid #2f4f4f;
        }

        h1 {
            color: #0f2a4a;
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box; /* Garante que o padding não aumente a largura */
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #2f4f4f;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0f2a4a;
        }

        #result {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 4px;
            display: none; /* Escondido inicialmente */
        }

        .info { background-color: #e7f3ff; color: #0c5460; }
        .success { background-color: #d4edda; color: #155724; }
        .warning { background-color: #fff3cd; color: #856404; }
        .danger { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Senai Suzano</h1>
        
        <div class="input-group">
            <label for="weight">Peso (kg):</label>
            <input type="number" id="weight" placeholder="Ex: 75.5" step="0.1">
        </div>

        <div class="input-group">
            <label for="height">Altura (m):</label>
            <input type="number" id="height" placeholder="Ex: 1.75" step="0.01">
        </div>

        <button onclick="calculateIMC()">Calcular</button>

        <div id="result"></div>
    </div>

    <script>
        // JavaScript Vanilla
        function calculateIMC() {
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value);
            const resultDiv = document.getElementById('result');

            // Validação simples
            if (isNaN(weight) || isNaN(height) || weight <= 0 || height <= 0) {
                alert("Por favor, insira valores válidos para peso e altura.");
                return;
            }

            const imc = (weight / (height * height)).toFixed(2);
            let classification = "";
            let className = "";

            // Lógica de classificação baseada na OMS
            if (imc < 18.5) {
                classification = "Abaixo do peso";
                className = "warning";
            } else if (imc >= 18.5 && imc <= 24.9) {
                classification = "Peso normal";
                className = "success";
            } else if (imc >= 25 && imc <= 29.9) {
                classification = "Sobrepeso";
                className = "warning";
            } else if (imc >= 30 && imc <= 34.9) {
                classification = "Obesidade Grau I";
                className = "danger";
            } else if (imc >= 35 && imc <= 39.9) {
                classification = "Obesidade Grau II";
                className = "danger";
            } else {
                classification = "Obesidade Grau III";
                className = "danger";
            }

            // Exibir resultado
            resultDiv.style.display = "block";
            resultDiv.className = className;
            resultDiv.innerHTML = `<strong>Seu IMC é ${imc}</strong><br>Situação: ${classification}`;
        }
    </script>

</body>
</html>
